<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>This EVE Life · Starting Soon (PreSolo)</title>
<meta name="viewport" content="width=1920,height=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
  /* PreSolo: the solo-stream Starting Soon screen. OBS Browser Source: 1920 x 1080.
     Same look as preshow.html, but the TODAY box is fixed text ("Ceema Plays EVE & Office Hours"),
     not filled from the Discord calendar, and needs no URL options. To change the text,
     edit the Today box in this file. Add ?guide=1 to see the sample in the Countdown box
     while you line up the Countdown Text source; remove it for the live scene. */
  :root{
    --void:#03060e; --panel:#09142c; --edge:#1c2c4d;
    --blue:#2e8bff; --cyan:#35d6ff; --magenta:#f22dc8; --pink:#ff5cc8;
    --text-hi:#fff; --text-mid:#c9d6ee; --text-dim:#8b98b8; --text-faint:#7a89ad;
    --display:'Orbitron',system-ui,sans-serif;
    --body:'Rajdhani',system-ui,sans-serif;
    --mono:'Share Tech Mono',ui-monospace,monospace;
    --glow-pink:0 0 30px #f22dc866,0 0 6px #ff5cc8cc;
    --glow-cyan:0 0 24px #35d6ff55;
    --ch:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--void)}
  body{color:var(--text-mid);font-family:var(--body)}

  .stage{position:relative;width:1920px;height:1080px;transform-origin:0 0;
    background:
      radial-gradient(ellipse at 18% 0%,#12245a55 0%,transparent 55%),
      radial-gradient(ellipse at 85% 10%,#3a0f4d4d 0%,transparent 50%),
      radial-gradient(ellipse at 50% 110%,#02218a33 0%,transparent 60%),
      linear-gradient(#2e8bff10 1px,transparent 1px),
      linear-gradient(90deg,#2e8bff10 1px,transparent 1px),
      var(--void);
    background-size:auto,auto,auto,56px 56px,56px 56px,auto;
  }
  .chamfer{clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
  .center{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center}

  .corner{position:absolute;width:70px;height:70px;border-color:var(--edge);border-style:solid;border-width:0}
  .corner.tl{top:36px;left:36px;border-top-width:2px;border-left-width:2px}
  .corner.tr{top:36px;right:36px;border-top-width:2px;border-right-width:2px}
  .corner.bl{bottom:36px;left:36px;border-bottom-width:2px;border-left-width:2px}
  .corner.br{bottom:36px;right:36px;border-bottom-width:2px;border-right-width:2px}

  .brand{top:110px;gap:18px}
  .wordmark{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.14em;color:var(--text-hi)}
  .wordmark span{color:var(--pink)}

  .status{top:236px;gap:14px;font-family:var(--mono);font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim)}
  .status .dot{width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}

  h1{position:absolute;top:278px;left:0;right:0;text-align:center;white-space:nowrap;
    font-family:var(--display);font-weight:900;font-size:120px;line-height:1.3;letter-spacing:.06em;
    background:linear-gradient(180deg,#fff 0%,#dfe7f2 45%,#a9b6cf 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{top:460px;font-size:30px;font-weight:500;color:var(--text-dim)}
  .rule{position:absolute;top:520px;left:760px;width:400px;height:2px;
    background:linear-gradient(90deg,transparent,var(--pink),var(--magenta),transparent);box-shadow:var(--glow-pink)}

  /* two slots: Countdown Text source on the left, fixed Today text on the right */
  .label{position:absolute;top:586px;font-family:var(--display);font-weight:700;font-size:26px;
    letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:12px}
  .label::before{content:"";width:9px;height:9px;background:currentColor;box-shadow:0 0 10px currentColor}
  .label.pink{color:var(--pink)}
  .slot{position:absolute;top:630px;height:240px;background:linear-gradient(180deg,#101a32eb,#060b1af0);border:1px solid var(--edge)}
  .slot::after{content:"";position:absolute;left:0;top:34px;bottom:34px;width:4px}
  .slot.cd{left:180px;width:520px}
  .slot.cd::after{background:var(--cyan);box-shadow:var(--glow-cyan)}
  .slot.today{left:760px;width:980px}
  .slot.today::after{background:var(--pink);box-shadow:var(--glow-pink)}

  .sample{display:none;position:absolute;inset:0;align-items:center;outline:2px dashed #ff5cc8aa;outline-offset:-12px}
  .guide .sample{display:flex}
  .cd .sample{justify-content:center;font-family:var(--mono);font-size:110px;color:var(--text-hi);text-shadow:var(--glow-cyan)}
  .auto-today{position:absolute;inset:0 56px;display:flex;align-items:center;font-family:var(--display);font-weight:700;font-size:44px;line-height:1.3;color:var(--text-hi);overflow:hidden;text-wrap:balance}
  .has-auto .today .sample{display:none!important}
  .today .sample{padding:0 56px;font-family:var(--display);font-weight:700;font-size:40px;line-height:1.35;color:var(--text-hi)}

  .foot{top:990px;gap:28px;font-family:var(--mono);font-size:26px;letter-spacing:.14em;color:var(--text-dim);text-transform:uppercase}
  .foot i{width:6px;height:6px;background:var(--pink);box-shadow:0 0 8px var(--pink);display:block}
  @media(prefers-reduced-motion:reduce){.status .dot{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

  <div class="center brand">
    
    <div class="wordmark">THIS <span>EVE</span> LIFE</div>
  </div>

  <div class="center status"><span class="dot"></span>Incoming transmission</div>
  <h1><span id="h1t">STARTING SOON</span></h1>
  <div class="center tagline">EVE isn't about the ships, it's about the people who fly them.</div>
  <div class="rule"></div>

  <div class="label" style="left:180px">Countdown</div>
  <div class="slot cd chamfer"><div class="sample">9:59</div></div>

  <div class="label pink" style="left:760px">Today</div>
  <div class="slot today chamfer"><div class="auto-today" id="today">Ceema Plays EVE &amp; Office Hours</div></div>

  <div class="center foot">twitch.tv/ceemagpt <i></i> youtube.com/@CeemaGPT <i></i> discord.thisevelife.space <i></i> spotify.thisevelife.space</div>
</div>
<script>
  try{ if(/[?&]guide=1/.test(location.search)) document.body.classList.add('guide'); }catch(e){}
  function fitBox(el,max,min){var f=max;el.style.fontSize=f+'px';
    while((el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)&&f>min){f-=1;el.style.fontSize=f+'px';}}
  // Today is fixed text (no Discord calendar on this page)
  var todayEl=document.getElementById('today');
  function fitToday(){fitBox(todayEl,44,22);}
  fitToday(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitToday);

  function fit(){
    var s=Math.min(innerWidth/1920,innerHeight/1080);
    var st=document.getElementById('stage');
    st.style.transform = s<0.999||s>1.001 ? 'scale('+s+')' : '';
    document.documentElement.style.width=document.body.style.width=(s<1?innerWidth:1920)+'px';
    document.documentElement.style.height=document.body.style.height=(s<1?innerHeight:1080)+'px';
  }
  addEventListener('resize',fit); fit();
  function fitTitle(){var h=document.querySelector('h1'),t=document.getElementById('h1t');if(!h||!t)return;h.style.fontSize='';
    var f=parseFloat(getComputedStyle(h).fontSize);
    while(t.getBoundingClientRect().width>1760&&f>40){f-=2;h.style.fontSize=f+'px';}}
  fitTitle(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitTitle);
</script>
</body>
</html>
