<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>This EVE Weather Channel</title>
<meta name="viewport" content="width=1920,height=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap">
<style>
  /* OBS Browser Source: 1920 x 1080. This EVE Weather Channel, the TEL-Weather scene pack (added 2026-11-03): a silent
     Twitch show in the style of the 1990s weather channel. Six data cards, one per OBS scene, picked with ?scene=;
     Chris switches them from the Stream Deck. No camera, no presenter, no system name. Spec:
     docs/superpowers/specs/2026-11-03-tel-weather-design.md. Setup: tel-weather/README.md.

     Bands (every card keeps all four, so a switch moves nothing the viewer is reading):
       Header        y 0 to 110, opaque: THIS EVE WEATHER CHANNEL right, the EVE-time clock centre, and the top-left corner
                     kept clear for the music bar (pc/weather-nowplaying.html, a separate local Browser Source above this
                     page: x 60, y 56, 760 x 44).
       Card          y 110 to 760 (the plate at x 40, y 126, 1840 x 624).
       Coming Up     x 40, y 770, 1840 x 246 (Chris, 2026-11-04: replaces the Local chat strip): the next card in the
                     rotation, its one-line teaser, "NEXT IN m:ss" and a live preview of it (this page at 20% in an iframe,
                     ?mini=1, reading the shared cache; no extra pulls). The order and the time per card match
                     tel-rotate.lua (default Station ID, Conditions, Outlook, Hot Systems, Forecast, Headlines; ?order=station,conditions,... and ?dwell=75); OBS's obsSceneChanged /
                     obsSourceActiveChanged events restart the countdown when the scene goes live. ?next=0 hides the band.
       Scroll        y 1022 to 1080: the weather scroll from weather.html (eight cities, EVE NEWS, UP NEXT, the addresses).

     Scenes (?scene=):  conditions (default)  outlook  hot  forecast  headlines  station
     Data: each source is pulled when the first card page opens and the reading is shared by all six scenes (localStorage).
     Weather (Open-Meteo, one request for the eight cities) and ESI (status, system_kills, system_jumps, names) are pulled
     again every hour while a card page is open (Chris, 2026-11-03: hot systems and weather every hour, not
     the forecast and headlines). /api/public/news, the calendar and the patch dates are pulled once for the evening
     (12 hours). /api/weather (the lines Chris types on the Ceema Plays desk) has a 20 s copy, so right-click > Refresh on
     a card source picks up a new push. ?poll=1 brings the old fast polling back (weather and ESI every 10 min, site every
     2 min, desk every 20 s). The last reading stays up when a pull fails.

     Vanguard and Frontier (Chris, 2026-11-04): /api/public/news now carries kind 'vanguard' (eveonline.com items that name
     EVE Vanguard) and 'frontier' (evefrontier.com, read by the website app hourly). Headlines and the scroll tag them;
     Forecast shows the newest three under the calendar, and the calendar itself lists CCP's dated events (UPCOMING, in
     this file; past dates drop off) when nothing is typed.
     Options: ?units=f|c|both   ?speed=55 (scroll, px/s)   ?ticker=0   ?next=0   ?news=0   ?upnext=0   ?auto=0 (no calendar)   ?poll=1
              ?desk=0 (ignore the typed lines)   ?guide=1 (sample data, no outside request; ?case= picks a test case)
              ?src=manual (TEL-Manual: shows from manual.json beside the page; news skipped; weather and ESI still load)
              ?now=2026-11-03T20:30Z (test clock) */
  :root{
    --void:#03060e; --edge:#1c2c4d;
    --blue:#2e8bff; --cyan:#35d6ff; --magenta:#f22dc8; --pink:#ff5cc8; --amber:#FF8A3D;
    --text-hi:#fff; --text-mid:#c9d6ee; --text-dim:#8b98b8;
    --display:'Orbitron',system-ui,sans-serif;
    --body:'Rajdhani',system-ui,sans-serif;
    --mono:'Share Tech Mono',ui-monospace,monospace;
    --ch:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
  .stage{position:relative;width:1920px;height:1080px;transform-origin:0 0}
  .chamfer{clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}

  /* header band, the 90s channel bar on the TEL blues */
  .hdr{position:absolute;left:0;top:0;width:1920px;height:110px;background:linear-gradient(180deg,#0e2a66,#061436);
    border-bottom:2px solid #fff;box-shadow:0 6px 18px #0009}
  .hdr::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;background:linear-gradient(90deg,var(--pink),var(--blue));opacity:.8}
  .wordmark{position:absolute;right:40px;top:0;height:108px;display:flex;align-items:center;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.14em;color:var(--text-hi);white-space:nowrap;text-shadow:0 2px 0 #000a}
  .wordmark span{color:var(--pink);margin:0 .32em}
  .clock{position:absolute;left:960px;top:0;height:108px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:34px;letter-spacing:.1em;color:var(--cyan);white-space:nowrap}
  .clock small{font-size:26px;color:var(--text-mid);letter-spacing:.2em}
  .musicph{display:none;position:absolute;left:60px;top:56px;width:760px;height:44px;outline:2px dashed #35d6ff66;outline-offset:-2px;
    align-items:center;justify-content:center;font-family:var(--mono);font-size:26px;letter-spacing:.2em;color:#7a89ad}
  .guide .musicph{display:flex}

  /* the card plate */
  .card{position:absolute;left:40px;top:126px;width:1840px;height:624px;padding:26px 40px 30px;
    background:linear-gradient(180deg,#101a32f2,#060b1af5);border:1px solid var(--edge);display:flex;flex-direction:column;gap:18px;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:26px;bottom:26px;width:5px;background:var(--pink);box-shadow:0 0 18px #f22dc8aa}
  .ct{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.06em;color:var(--text-hi);line-height:1;display:flex;align-items:baseline;gap:22px;flex:none}
  .ct small{font-family:var(--mono);font-weight:400;font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
  .cbody{flex:1;min-height:0;position:relative}
  .scene-station .card{background:none;border:0}
  .scene-station .card::before{display:none}

  /* Coming Up band: the next card in the rotation, with a live preview of it */
  .next{position:absolute;left:40px;top:770px;width:1840px;height:246px;padding:15px 40px 15px 40px;
    background:linear-gradient(180deg,#101a32f2,#060b1af5);border:1px solid var(--edge);display:flex;align-items:center;gap:40px;overflow:hidden}
  .next::before{content:"";position:absolute;left:0;top:26px;bottom:26px;width:5px;background:var(--cyan);box-shadow:0 0 18px #35d6ffaa}
  .nx-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
  .nx-label{font-family:var(--mono);font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
  .nx-title{font-family:var(--display);font-weight:800;font-size:52px;letter-spacing:.06em;color:var(--text-hi);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nx-teaser{font-family:var(--body);font-weight:600;font-size:30px;color:var(--text-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nx-in{flex:none;min-width:300px;text-align:right;font-family:var(--mono);font-size:30px;letter-spacing:.14em;color:var(--pink);white-space:nowrap}
  .nx-in:empty{display:none}
  .nx-prev{flex:none;position:relative;width:384px;height:216px;border:1px solid var(--edge);box-shadow:0 0 0 1px #35d6ff22 inset;background:var(--void);overflow:hidden}
  .nx-prev iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform:scale(.2);transform-origin:0 0;pointer-events:none;background:var(--void)}
  .nx-prev .tag{position:absolute;right:0;bottom:0;padding:2px 10px;background:#03060ecc;border-top:1px solid var(--edge);border-left:1px solid var(--edge);
    font-family:var(--mono);font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);line-height:1.2}
  .nonext .next{display:none}
  .mini .nx-prev .tag,.mini .musicph{display:none}

  /* the scroll along the bottom, as on weather.html but full width */
  .ticker{position:absolute;left:0;top:1022px;width:1920px;height:58px;display:flex;align-items:center;
    background:#03060eeb;border-top:1px solid var(--edge);overflow:hidden}
  .noticker .ticker{display:none}
  .tk-label{flex:none;display:flex;align-items:center;gap:12px;padding:0 22px 0 26px;height:100%;border-right:1px solid var(--edge);
    font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
  .tk-win{position:relative;flex:1;min-width:0;height:100%;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40px,#000 calc(100% - 40px),transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 40px,#000 calc(100% - 40px),transparent 100%)}
  .tk-track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
  .tk-set{display:flex;align-items:center;flex:none;height:100%}
  .tk-item{flex:none;display:flex;align-items:center;gap:12px;padding:0 28px;height:100%;font-family:var(--body);font-weight:600;font-size:28px;letter-spacing:.02em;color:var(--text-mid)}
  .tk-city{font-family:var(--mono);font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-hi)}
  .tk-temp{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;color:var(--pink)}
  .tk-cond{color:var(--text-mid)}
  .tk-item svg{width:30px;height:30px;flex:none;color:var(--cyan);filter:drop-shadow(0 0 6px #35d6ff66)}
  .tk-item.night svg{color:#a9b0ff}
  .tk-dot{flex:none;width:7px;height:7px;background:var(--pink);box-shadow:0 0 8px var(--pink);transform:rotate(45deg);display:block}
  .tk-head{flex:none;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.2em;padding:2px 12px;margin:0 6px 0 10px;border:1px solid var(--pink);color:var(--pink);background:#f22dc81f}
  .tk-kind{font-family:var(--mono);font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
  .tk-kind.patch{color:var(--pink)}
  .tk-kind.vanguard,.tk-kind.frontier{color:var(--text-mid)}
  .tk-when{font-family:var(--mono);font-size:26px;letter-spacing:.08em;color:var(--cyan)}
  .tk-tag{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.16em;padding:0 10px;border:1px solid var(--blue);color:var(--cyan);background:#1470e920}
  .tk-tag.yt{border-color:#ff3030;color:#ff8080;background:#ff30301c}
  .tk-tag.sp{border-color:#1db954;color:#7be8a0;background:#1db95420}
  .tk-tag.dc{border-color:#5865f2;color:#a9b0ff;background:#5865f21f}
  @keyframes tkscroll{to{transform:translateX(calc(-1 * var(--w)))}}
  @media(prefers-reduced-motion:reduce){.tk-track{animation:none!important}}
  /* Conditions: 4 x 2 city tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:16px;height:100%}
  .tile{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;background:#0b142866;border:1px solid var(--edge);padding:6px;min-height:0}
  .tile .city{font-family:var(--mono);font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
  .tile svg{width:72px;height:72px;color:var(--cyan);filter:drop-shadow(0 0 10px #35d6ff66)}
  .tile.night svg{color:#a9b0ff}
  .tile .temp{font-family:var(--display);font-weight:700;font-size:48px;letter-spacing:.02em;color:var(--pink);line-height:1;white-space:nowrap}
  .tile .cond{font-family:var(--body);font-weight:600;font-size:30px;color:var(--text-mid);line-height:1.1}
  .tile .tod{font-family:var(--mono);font-size:26px;letter-spacing:.2em;color:var(--text-dim)}
  .tile.none svg{opacity:.25}
  /* Headlines and Forecast rows */
  .rows{display:flex;flex-direction:column;gap:12px;height:100%}
  .row{display:flex;align-items:center;gap:22px;min-height:52px;border-bottom:1px solid #1c2c4d88;padding-bottom:8px}
  .row .kind{flex:none;min-width:160px;font-family:var(--mono);font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
  .row .kind.patch{color:var(--pink)}
  .row .kind.vanguard,.row .kind.frontier{color:var(--text-mid)}
  .row .day .g{display:block;font-size:22px;letter-spacing:.2em;color:var(--text-dim)}
  .rows.split{height:auto}
  .rows.games .row{min-height:48px;padding-bottom:6px}
  .rows.split .ev{-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;display:block}   /* two blocks share the column: one line each */
  .row .when{flex:none;min-width:330px;font-family:var(--mono);font-size:28px;letter-spacing:.06em;color:var(--cyan);white-space:nowrap}
  .row .when.live{color:var(--pink)}
  .row .txt{flex:1;min-width:0;font-family:var(--body);font-weight:600;font-size:32px;color:var(--text-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .day{flex:none;min-width:120px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:28px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink)}
  .row .ev{flex:1;min-width:0;font-family:var(--body);font-weight:600;font-size:32px;line-height:1.15;color:var(--text-mid);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{font-family:var(--body);font-weight:600;font-size:34px;color:var(--text-dim)}
  .cols{display:grid;grid-template-columns:880px 1fr;gap:40px;height:100%}
  .cols>div{min-width:0}
  .colh{font-family:var(--mono);font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:var(--pink);margin-bottom:14px}
  /* Station ID */
  .station{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
  .station .big{font-family:var(--display);font-weight:800;font-size:96px;letter-spacing:.1em;line-height:1.05;color:var(--text-hi);text-shadow:0 4px 0 #000a,0 0 40px #2e8bff55}
  .station .big span{color:var(--pink)}
  .station .clk{font-family:var(--mono);font-size:48px;letter-spacing:.14em;color:var(--cyan)}
  .station .glyphs{display:flex;gap:34px;align-items:flex-end}
  .station .glyphs div{display:flex;flex-direction:column;align-items:center;gap:6px}
  .station .glyphs svg{width:64px;height:64px;color:var(--cyan)}
  .station .glyphs .night svg{color:#a9b0ff}
  .station .glyphs span{font-family:var(--mono);font-size:26px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  .station .slogan{font-family:var(--body);font-weight:600;font-size:40px;color:var(--text-mid);max-width:1500px}
  .station .links{display:flex;gap:40px}
  .station .links span{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:28px;color:var(--text-mid)}
  /* Outlook: stat tiles and the forecaster's note */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
  .stat{background:#0b142866;border:1px solid var(--edge);padding:16px 24px;display:flex;flex-direction:column;gap:8px}
  .stat .lab{font-family:var(--mono);font-size:26px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-dim)}
  .stat .val{font-family:var(--display);font-weight:700;font-size:72px;line-height:1;color:var(--text-hi);white-space:nowrap}
  .stat .val.ok{color:var(--cyan)} .stat .val.vip{color:var(--amber)}
  .note{background:linear-gradient(180deg,#0e2a6655,#06143655);border:1px solid var(--edge);padding:24px 28px;margin-top:6px;display:flex;flex-direction:column;gap:8px}
  .note .lab{font-family:var(--mono);font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:var(--pink)}
  .note .txt{font-family:var(--body);font-weight:600;font-size:40px;line-height:1.2;color:var(--text-hi);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scene-outlook .cbody{display:flex;flex-direction:column;justify-content:space-between}
  .scene-outlook .note .txt{font-size:46px;-webkit-line-clamp:4}
  .nexton{margin-top:16px;display:flex;align-items:center;gap:20px;font-family:var(--body);font-weight:600;font-size:32px;color:var(--text-mid);white-space:nowrap;overflow:hidden}
  .nexton .lab{font-family:var(--mono);font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);flex:none}
  .nexton .when{font-family:var(--mono);font-size:28px;color:var(--pink);flex:none}
  .nexton .nm{overflow:hidden;text-overflow:ellipsis}
  /* Hot Systems table */
  .hot{display:flex;flex-direction:column;height:100%;min-height:0}
  .hrow{display:grid;grid-template-columns:70px 1fr 260px 260px 260px;gap:18px;align-items:center;padding:0;flex:1 1 0;min-height:0;border-bottom:1px solid #1c2c4d88}
  .hrow.head{flex:none;padding:0 0 6px;border-bottom:1px solid var(--edge)}
  .hrow.head span{font-family:var(--mono);font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);text-align:right}
  .hrow.head span:nth-child(2){text-align:left}
  .hrow .rk{font-family:var(--mono);font-size:30px;color:var(--text-dim)}
  .hrow .sys{min-width:0;display:flex;flex-direction:column;gap:2px}
  .hrow .sys b{font-family:var(--body);font-weight:700;font-size:44px;line-height:1;color:var(--text-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow .sys i{font-style:normal;font-family:var(--body);font-weight:600;font-size:30px;line-height:1;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow .num{font-family:var(--display);font-weight:700;font-size:36px;text-align:right;white-space:nowrap}
  .hot.many .sys b{font-size:34px} .hot.many .sys i{font-size:26px} .hot.many .num{font-size:30px}
  .hrow .num.k{color:var(--pink)} .hrow .num.p{color:var(--text-dim)} .hrow .num.j{color:var(--cyan)}
  /*CARD-CSS*/
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hdr">
    <div class="musicph">MUSIC BAR 760 × 44</div>
    <div class="clock"><span id="clock">00:00</span><small>EVE</small></div>
    <div class="wordmark">THIS <span>EVE</span> WEATHER CHANNEL</div>
  </div>

  <div class="card chamfer" id="card"></div>

  <div class="next chamfer" id="next">
    <div class="nx-text"><div class="nx-label">Coming up</div><div class="nx-title" id="nxTitle"></div><div class="nx-teaser" id="nxTeaser"></div></div>
    <div class="nx-in" id="nxIn"></div>
    <div class="nx-prev" id="nxPrev"><div class="tag">Preview</div></div>
  </div>

  <div class="ticker" id="ticker"><div class="tk-label">EVE Weather</div><div class="tk-win" id="tkWin"><div class="tk-track" id="tkTrack"></div></div></div>
</div>
<script>
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ q={get:function(){return null}}; }
  var MANUAL=q.get('src')==='manual', GUIDE=q.get('guide')==='1', CASE=GUIDE?(q.get('case')||''):'', auto=q.get('auto')!=='0';
  var UNITS=(q.get('units')||'both').toLowerCase(); if(UNITS!=='f'&&UNITS!=='c') UNITS='both';
  var SPEED=Math.max(10,Math.min(300,parseFloat(q.get('speed'))||55));
  var SHOW_NEWS=q.get('news')!=='0'&&!MANUAL, SHOW_NEXT=q.get('upnext')!=='0'&&auto, DESK=q.get('desk')!=='0'&&!MANUAL;
  var SCENES=['conditions','outlook','hot','forecast','headlines','station'];
  var KIND_LABEL={patch:'Patch',vanguard:'Vanguard',frontier:'Frontier'};
  function kindClass(n){ return KIND_LABEL[n.kind]?n.kind:''; }
  function kindLabel(n){ return KIND_LABEL[n.kind]||'News'; }
  var SCENE=q.get('scene')||'conditions'; if(SCENES.indexOf(SCENE)<0) SCENE='conditions';
  document.body.classList.add('scene-'+SCENE);
  if(GUIDE) document.body.classList.add('guide');
  if(q.get('ticker')==='0') document.body.classList.add('noticker');
  var MINI=q.get('mini')==='1'; if(MINI) document.body.classList.add('mini');
  if(q.get('next')==='0'||q.get('local')==='0') document.body.classList.add('nonext');
  function fit(){
    var s=Math.min(innerWidth/1920,innerHeight/1080), st=document.getElementById('stage');
    st.style.transform = Math.abs(s-1)>.001 ? 'scale('+s+')' : '';
  }
  addEventListener('resize',fit); fit();
  function el(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;}

  /* ---------- show timing (same rule in every TEL overlay) ----------
     A show is ON from its start to its end, then HOLDS for 30 minutes, then the next show takes over.
     If the next show starts inside those 30 minutes, it takes over at the end instead. ?now= is the test clock. */
  var SKIP_RE=/no\s*show|vacation|to\s*be\s*booked|\bTBB\b|cancel/i;
  var HOLD_MS=30*60*1000, LEAD_MS=90*60*1000;
  var TEST_NOW=q.get('now')?Date.parse(q.get('now')):NaN, CLOCK_OFF=isNaN(TEST_NOW)?0:TEST_NOW-Date.now();
  function nowMs(){return Date.now()+CLOCK_OFF;}
  if(!isNaN(TEST_NOW)&&!MINI){
    var tb=document.createElement('div');

  function esiGet(path){ return fetch(ESI+path+'?datasource=tranquility',{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }); }
  function namesFor(ids){                                // POST names; fall back to one GET per system
    return fetch(ESI+'/universe/names/?datasource=tranquility',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ids)})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(list){ var m={}; (list||[]).forEach(function(x){ if(x&&x.id) m[x.id]=x.name; }); return m; })
      .catch(function(){ return Promise.all(ids.map(function(id){ return esiGet('/universe/systems/'+id+'/').then(function(x){return [id,x&&x.name];}).catch(function(){return [id,null];}); }))
        .then(function(pairs){ var m={}; pairs.forEach(function(p){ if(p[1]) m[p[0]]=p[1]; }); return m; }); });
  }
  function loadEsi(){
    if(GUIDE){
      if(CASE==='esidown'||CASE==='typedonly'){ esi=null; update(); return; }
      esi={players:24318,vip:false,at:nowMs()-7*60000,kills:[['Jita',61,120,2400],['Tama',44,30,310],['Amamake',37,41,280],['Uedama',29,12,900],['1DQ1-A',22,9,410]]
        .map(function(r){return {name:r[0],ship:r[1],pod:r[2],jumps:r[3]};})};
      update(); return;
    }
    var c=cget('esi',ESI_MS-5000); if(c){ esi=c; update(); return; }
    if(!claim('esi')){ update(); return; }
    Promise.all([esiGet('/status/'),esiGet('/universe/system_kills/'),esiGet('/universe/system_jumps/')]).then(function(res){
      var st=res[0]||{}, kills=(res[1]||[]).filter(function(k){return k&&typeof k.ship_kills==='number';}).sort(function(a,b){return b.ship_kills-a.ship_kills;}).slice(0,5);
      var jumps={}; (res[2]||[]).forEach(function(j){ if(j&&j.system_id) jumps[j.system_id]=j.ship_jumps; });
      if(!kills.length) throw 0;                       // downtime: keep the last reading
      return namesFor(kills.map(function(k){return k.system_id;})).then(function(nm){
        esi={players:typeof st.players==='number'?st.players:null,vip:!!st.vip,at:nowMs(),
          kills:kills.map(function(k){return {name:nm[k.system_id]||('System '+k.system_id),ship:k.ship_kills,pod:k.pod_kills||0,jumps:jumps[k.system_id]||0};})};
        cput('esi',esi); update();
      });
    }).catch(update);
  }
  function fmt(n){ return n==null?'—':String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
  RENDER.outlook=function(card){
    card.appendChild(title(esi?asOf(esi.at):'Waiting for ESI'));
    var body=el('div','cbody'); card.appendChild(body);
    var stats=el('div','stats'); body.appendChild(stats);
    function stat(lab,val,cls){ var d=el('div','stat'); d.appendChild(el('div','lab',lab)); d.appendChild(el('div','val'+(cls?' '+cls:''),val)); stats.appendChild(d); }
    stat('Pilots online', esi?fmt(esi.players):'—');
    stat('Tranquility', esi?(esi.vip?'VIP':'ONLINE'):'—', esi?(esi.vip?'vip':'ok'):'');
    var d=new Date(nowMs()); stat('EVE time', p2(d.getUTCHours())+':'+p2(d.getUTCMinutes()));
    var note=el('div','note'); body.appendChild(note);
    note.appendChild(el('div','lab',"Forecaster's note"));
    note.appendChild(el('div','txt',deskLine('outlook').title||"Clear skies across New Eden. Fly safe, or don't."));
    var nx=(shows||[])[0];
    if(nx){ var row=el('div','nexton'); row.appendChild(el('span','lab','Next on This EVE Life')); row.appendChild(el('span','when',nx.live?'LIVE NOW':whenOf(nx.at))); row.appendChild(el('span','nm',nx.name)); body.appendChild(row); }
  };
  var HOUSE_LINES={jita:'Heavy scams with a chance of gank',amamake:'Scattered frigates, gusting to cruisers',tama:'Gate camps until further notice',
    uedama:'Freighter showers on the gate, bring an umbrella',rancer:'Smartbomb warnings in effect',niarja:'Clear since the trig weather moved in',
    '1dq1-a':'Partly cloudy with Rorquals',hek:'Mild, with a chance of market PvP',dodixie:'Mostly haulers',rens:'Light trade winds',
    'd-pnp9':'Seasonal fog over the keepstar',thera:'Wormhole weather, variable',perimeter:'Overcast, scam fronts drifting in from Jita',
    'old man star':'Local on the 8s, every 8 minutes a new fight',ahbazon:'Bubble storms on the lowsec gate'};
  function houseLine(name){ return HOUSE_LINES[String(name||'').toLowerCase()]||''; }
  RENDER.hot=function(card){
    card.appendChild(title(esi?'The hour before '+asOf(esi.at).slice(6):'Last hour · ESI'));
    var body=el('div','cbody'), t=el('div','hot'); body.appendChild(t); card.appendChild(body);
    var typed=['hot1','hot2','hot3','hot4','hot5'].map(deskLine).filter(function(v){return v.title;});
    var rows=(esi?esi.kills:[]).map(function(k){ var m=typed.filter(function(v){return v.title.toLowerCase()===k.name.toLowerCase();})[0]; return {name:k.name,ship:k.ship,pod:k.pod,jumps:k.jumps,line:m?m.sub:houseLine(k.name)}; });
    typed.forEach(function(v){ if(rows.length<7&&!rows.some(function(r){return r.name.toLowerCase()===v.title.toLowerCase();})) rows.push({name:v.title,ship:null,pod:null,jumps:null,line:v.sub}); });
    if(rows.length>5) t.classList.add('many');          // 5 live plus up to 2 typed quiet systems; rows share the height
    if(!rows.length){ t.appendChild(el('div','empty','No kill data yet')); return; }
    var h=el('div','hrow head'); ['#','System','Ship kills','Pod kills','Jumps'].forEach(function(x){h.appendChild(el('span',null,x));}); t.appendChild(h);
    rows.forEach(function(r,i){
      var row=el('div','hrow'); row.appendChild(el('span','rk',String(i+1)));
      var sys=el('div','sys'); sys.appendChild(el('b',null,r.name)); if(r.line) sys.appendChild(el('i',null,r.line)); row.appendChild(sys);
      row.appendChild(el('span','num k',fmt(r.ship))); row.appendChild(el('span','num p',fmt(r.pod))); row.appendChild(el('span','num j',fmt(r.jumps)));
      t.appendChild(row);
    });
  };
  if(GUIDE&&CASE==='typedquiet'){ desk={hot1:{title:'Jita',sub:'Heavy scams, 90% chance of gank'},hot2:{title:'Delve',sub:'Partly cloudy with Rorquals'}}; DESK=false; }   // neither is in the sample top 5: Jita is, Delve is not
  if(GUIDE&&CASE==='manylines'){ desk={hot1:{title:'Jita',sub:'line'},hot2:{title:'Tama',sub:'line'},hot3:{title:'Amamake',sub:'line'},hot4:{title:'Delve',sub:'line'},hot5:{title:'Thera',sub:'line'},fc1:{title:'Tuesday after downtime, the patch day for real',sub:'short'}}; DESK=false; }
  if(GUIDE&&CASE==='nolines'){ desk={}; DESK=false; }
  if(GUIDE&&CASE==='esidown'){ desk={}; DESK=false; }
  if(GUIDE&&CASE==='typedonly'){ desk={hot1:{title:'Jita',sub:'Heavy scams, 90% chance of gank'}}; DESK=false; }
  if(GUIDE&&CASE==='long'){ var L=new Array(21).join('Long line '); desk.outlook={title:L,sub:''}; desk.hot1={title:'Jita',sub:L}; DESK=false; }
  if(MINI&&!GUIDE){ update(); } else { loadEsi(); if(POLL) setInterval(loadEsi,ESI_MS); else setTimeout(function(){ setInterval(loadEsi,RECHECK_MS); },JIT); }

  /* ---------- Coming Up band (Chris, 2026-11-04): the next card, its teaser, a countdown and a live preview ---------- */
  var TEASERS={conditions:'Eight cities at a glance, San Francisco to Sydney.',outlook:'Pilots online, Tranquility status and the forecaster\'s note.',
    hot:'The five systems with the most ship kills in the last hour.',forecast:'Patch days, downtime and the next This EVE Life shows.',
    headlines:'The latest from the EVE Online news desk.',station:'You are watching This EVE Weather Channel.'};
  var OBS_NAMES={'Conditions':'conditions','Outlook':'outlook','Hot Systems':'hot','Forecast':'forecast','Headlines':'headlines','Station ID':'station'};
  var DEFAULT_ORDER=['station','conditions','outlook','hot','forecast','headlines'];   // tel-rotate.lua's default list (Chris, 2026-11-04: Station ID first)
  var ORDER=(q.get('order')||'').split(',').filter(function(k){return SCENES.indexOf(k)>=0;}); if(ORDER.length<2) ORDER=DEFAULT_ORDER.slice();
  var DWELL=Math.max(5,Math.min(3600,parseInt(q.get('dwell'),10)||75));
  function nextOf(k){ var i=ORDER.indexOf(k); return ORDER[i+1]||ORDER[0]; }   // off the list: the rotation rejoins at the first card
  var NEXT=nextOf(SCENE), activeAt=Date.now();
  if(!document.body.classList.contains('nonext')){
    document.getElementById('nxTitle').textContent=TITLES[NEXT];
    document.getElementById('nxTeaser').textContent=TEASERS[NEXT];
  }
  if(!MINI&&!document.body.classList.contains('nonext')){   // the preview frame shows its band as text only: no frame inside a frame, no countdown
    var pf=document.createElement('iframe'); pf.setAttribute('title','Preview of '+TITLES[NEXT]); pf.setAttribute('aria-hidden','true');
    var pq=new URLSearchParams(location.search); pq.set('scene',NEXT); pq.set('mini','1'); pq.delete('next'); pq.delete('local'); pq.delete('poll');
    pf.src=location.pathname+'?'+pq.toString(); document.getElementById('nxPrev').appendChild(pf);
    var nxIn=document.getElementById('nxIn');
    function countdown(){ var left=Math.ceil(DWELL-(Date.now()-activeAt)/1000);
      nxIn.textContent = left>0 ? 'NEXT IN '+Math.floor(left/60)+':'+p2(left%60) : ''; }   // past the dwell (manual switching, or the hold): no number rather than a wrong one
    countdown(); setInterval(countdown,1000);
    addEventListener('obsSceneChanged',function(e){ if(e&&e.detail&&OBS_NAMES[e.detail.name]===SCENE){ activeAt=Date.now(); countdown(); } });
    addEventListener('obsSourceActiveChanged',function(e){ if(e&&e.detail&&e.detail.active){ activeAt=Date.now(); countdown(); } });
  }
  /*CARD-JS*/
</script>
