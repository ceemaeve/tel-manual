name: TEL-Manual feed

# Fills manual.json from the Discord calendar every 15 minutes, so the TEL-Manual overlays are current without
# the VPS and without the editor. Runs all the time: it writes only this repo's manual.json and touches nothing
# on thisevelife.space or in tel-sites, so it never fights the VPS. By hand: Actions -> TEL-Manual feed -> Run.
# Source: feed.py (published here from tel-sites tel-manual/ by publish.sh; edit it there). A "hold": true in
# manual.json (the editor's Hold switch) makes every run leave the file alone until the hold comes off.
# Secrets: DISCORD_BOT_TOKEN and DISCORD_GUILD_ID (repository secrets; the same read-only bot the VPS uses).
# GitHub's scheduler can lag a few minutes; the overlays re-read manual.json every 2 minutes anyway.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: tel-manual-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fill manual.json from Discord (secrets never printed)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$DISCORD_GUILD_ID" ]; then
            echo "::error::DISCORD_BOT_TOKEN and DISCORD_GUILD_ID must be set as repository secrets."
            exit 1
          fi
          python3 feed.py manual.json

      - name: Commit and push if manual.json changed
        run: |
          if git diff --quiet -- manual.json; then echo "manual.json unchanged"; exit 0; fi
          unexpected=$(git status --porcelain | grep -v ' manual.json$' || true)
          if [ -n "$unexpected" ]; then echo "::error::Unexpected changes, not pushing:"; echo "$unexpected"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual.json
          git commit -m "manual.json from Discord"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
