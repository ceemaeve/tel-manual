<style>
  /* OBS Browser Source, one per guest slot, placed UNDER the scene overlay (a guest with a camera covers it).
     Shows the guest's EVE portrait, no name plate (the scene overlay already has one). Fully see-through when there is
     no show in the guest window, no guest in that slot, or nothing could be loaded.

     Browser Source size: 2Cam 848 x 477, 3Cam 576 x 324, 4Cam 620 x 349.
     ?slot=2cam|3cam|4cam   sets the picture shape (default 3cam); size the source to match
     ?g=1|2|3               which guest, in feed order (default 1)
     ?g1=Name (or ?g2=, ?g3=)  type the guest by hand, same as on the camera pages
     ?char=Exact EVE Name   or  ?id=<characterID>   force the portrait when the Guests line is not the exact character name
     ?demo                  sample portrait for lining the source up without a show
     ?src=manual            TEL-Manual backup: read manual.json next to this page instead of the VPS feed (portraits still
                            come from CCP, so no VPS is needed); without it the page behaves exactly as before
     ?now=2026-10-10T20:30Z test clock (same as the camera pages)
     ?debug                 prints what it is doing in the corner (turn off for stream) */
  :root{ --void:#03060e; --blue:#2e8bff; --cyan:#35d6ff; --edge:#1c2c4d; }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:transparent;opacity:0;transition:opacity .45s ease}
  #stage.on{opacity:1}
  .bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(26px) brightness(.5) saturate(1.15);}
  .tint{position:absolute;inset:0;background:linear-gradient(135deg,rgba(46,139,255,.30),rgba(3,6,14,.35) 55%,rgba(242,45,200,.16))}
  .vig{position:absolute;inset:0;box-shadow:inset 0 0 90px rgba(3,6,14,.75)}
  .fg{position:absolute;top:0;height:100%;aspect-ratio:1/1;left:50%;transform:translateX(-50%);background-size:cover;background-position:center;
      box-shadow:0 0 0 2px rgba(53,214,255,.35),0 0 26px rgba(46,139,255,.45)}
  .logo{position:absolute;left:50%;top:50%;width:min(52%,82%);transform:translate(-50%,-50%);display:none}
  #stage.fallback .fg{display:none}
  #stage.fallback .logo{display:block;filter:drop-shadow(0 0 14px rgba(46,139,255,.6))}
  #stage.fallback .bg{background-image:none;background:radial-gradient(circle at 50% 40%,#0e1f45,#03060e 75%);filter:none}
  #dbg{position:fixed;left:4px;bottom:4px;font:12px/1.3 Consolas,monospace;color:#9fe;background:rgba(0,0,0,.7);padding:3px 6px;display:none;z-index:9;max-width:96%}
</style>

<script>
(function(){
  var q=new URLSearchParams(location.search);
  var SIZES={'2cam':[848,477],'3cam':[576,324],'4cam':[620,349]};
  var slot=SIZES[q.get('slot')]?q.get('slot'):'3cam', W=SIZES[slot][0], H=SIZES[slot][1];
  var G=Math.max(1,Math.min(3,parseInt(q.get('g'),10)||1));
  var stage=document.getElementById('stage'), bg=document.getElementById('bg'), fg=document.getElementById('fg'), dbg=document.getElementById('dbg');
  var DEBUG=q.has('debug');
  function log(m){ try{console.log('[avatar] '+m);}catch(e){} if(DEBUG){dbg.style.display='block';dbg.textContent=m;} }
  function fit(){                      // lay out at the slot size, scale to whatever size the source really is
    stage.style.width=W+'px'; stage.style.height=H+'px';
    var s=Math.min(innerWidth/W,innerHeight/H);
    stage.style.transform='scale('+s+')';
    stage.style.left=((innerWidth-W*s)/2)+'px'; stage.style.top=((innerHeight-H*s)/2)+'px';
  }
  addEventListener('resize',fit); fit();

  /* ---------- show timing: the same rule as the camera pages ---------- */
  var MANUAL=q.get('src')==='manual';   // TEL-Manual: manual.json beside this page, same as the camera pages
  var FEED_URL=MANUAL?'manual.json':'/api/public/feed', REFRESH_MS=2*60*1000, LEAD_MS=90*60*1000, HOLD_MS=30*60*1000, MEMO_KEY='tel-last-show';
  var SKIP_RE=/no\s*show|vacation|to\s*be\s*booked|\bTBB\b|cancel/i;
  var TEST_NOW=q.get('now')?Date.parse(q.get('now')):NaN, CLOCK_OFF=isNaN(TEST_NOW)?0:TEST_NOW-Date.now();
  function nowMs(){return Date.now()+CLOCK_OFF;}
  function pickShow(xs,now){
    var live=xs.filter(function(x){return now>=x.at&&now<x.end;})[0];
    if(live) return {x:live,state:'live'};
    var nx=xs.filter(function(x){return x.at>now;})[0];
    var held=xs.filter(function(x){return now>=x.end&&now<x.end+HOLD_MS;}).sort(function(a,b){return b.end-a.end;})[0];
    if(held&&!(nx&&nx.at<held.end+HOLD_MS)) return {x:held,state:'held'};
    return nx?{x:nx,state:'next'}:null;
  }
  function namesOf(str){ return String(str||'').split(/[;\n]/).map(function(x){return x.trim();}).filter(Boolean).map(function(n){return {name:n};}); }
  function guestsOf(show){
    if(Array.isArray(show.guests)) return show.guests.map(function(g){return {name:typeof g==='string'?g.trim():String(g&&g.name||'').trim()};}).filter(function(g){return g.name;});
    var m=/Guests?\s*:\s*([^\n]+)/i.exec(show.desc||'');
    return m?namesOf(m[1].replace(/…$/,'')):[];
  }
  function currentShow(list){
    var now=nowMs();
    var xs=(list||[]).filter(function(s){return !SKIP_RE.test(s.name||'');}).map(function(s){var at=Date.parse(s.at);return {s:s,at:at,end:s.endAt?Date.parse(s.endAt):at+3*3600e3};})
      .filter(function(x){return !isNaN(x.at);}).sort(function(a,b){return a.at-b.at;});
    var p=pickShow(xs,now);
    if(!p||(p.state==='next'&&p.x.at-now>LEAD_MS)) return null;
    return p.x;
  }
  function recalled(){      // the camera pages store the current show's guests; reuse it if the feed is unreachable
    try{ var m=JSON.parse(localStorage.getItem(MEMO_KEY)||'null'); var now=nowMs();
      return m&&now>=(m.at||m.end)-LEAD_MS&&now<m.end+HOLD_MS?m.guests:null; }catch(e){ return null; }
  }

  /* ---------- name -> character id (CCP ESI, no login) ---------- */
  var ESI_URL='https://esi.evetech.net/latest/universe/ids/';
  var IMG_URL='https://images.evetech.net/characters/';
  var cache={};                        // lowercase name -> id, or 0 when ESI said "no such character" (kept for the session)
  function lookup(name){
    var k=name.toLowerCase();
    if(k in cache) return Promise.resolve(cache[k]);
    return fetch(ESI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([name])})
      .then(function(r){ if(!r.ok) throw new Error('ESI HTTP '+r.status); return r.json(); })
      .then(function(d){
        var c=(d&&d.characters||[]).filter(function(x){return String(x.name).toLowerCase()===k;})[0];
        cache[k]=c?c.id:0; return cache[k];
      });
  }

  /* ---------- drawing ---------- */
  var shown=null;                      // key of what is on screen: 'id:123', 'logo' or '' (empty)
  var DEMO_SVG="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25406f"/><stop offset="1" stop-color="#0b1730"/></linearGradient></defs><rect width="512" height="512" fill="url(#g)"/><circle cx="256" cy="200" r="86" fill="#7f95bd"/><path d="M76 512c0-110 80-180 180-180s180 70 180 180z" fill="#7f95bd"/></svg>');
  function showEmpty(){ if(shown==='') return; shown=''; stage.classList.remove('on'); }
  function showLogo(why){ log('logo: '+why); if(shown==='logo') return; shown='logo'; stage.classList.add('fallback'); stage.classList.add('on'); }
  function showPortrait(key,url){
    if(shown===key) return;
    var im=new Image();               // load first so the slot never flashes a half-loaded picture
    im.onload=function(){
      shown=key; stage.classList.remove('fallback');
      fg.style.backgroundImage='url("'+url+'")'; bg.style.backgroundImage='url("'+url+'")';
      stage.classList.add('on'); log('portrait '+key);
    };
    im.onerror=function(){ showLogo('portrait image would not load ('+key+')'); };
    im.src=url;
  }
  var want='';                         // the latest request, so a slow lookup cannot overwrite a newer guest
  function apply(name){
    var charQ=q.get('char'), idQ=q.get('id');
    if(idQ&&/^\d+$/.test(idQ)){ want='id:'+idQ; return showPortrait('id:'+idQ,IMG_URL+idQ+'/portrait?size=512'); }
    var n=(charQ||name||'').trim();
    if(!n){ want=''; return showEmpty(); }
    want=n.toLowerCase();
    var mine=want;
    lookup(n).then(function(id){
      if(mine!==want) return;
      if(id) showPortrait('id:'+id,IMG_URL+id+'/portrait?size=512');
      else showLogo('no character named "'+n+'" (exact name needed; try ?char= or ?id=)');
    }).catch(function(e){
      if(mine!==want) return;
      showLogo('lookup failed for "'+n+'": '+e.message);   // not cached, so the next feed refresh tries again
    });
  }

  /* ---------- run ---------- */
  if(q.has('demo')){ shown='demo'; stage.classList.remove('fallback'); fg.style.backgroundImage='url("'+DEMO_SVG+'")'; bg.style.backgroundImage='url("'+DEMO_SVG+'")'; stage.classList.add('on'); return; }
  function guestName(guests){
    var o=q.get('g'+G); if(o&&o.trim()) return o.trim().split(/[;\n]/)[0].trim();
    return guests[G-1]?guests[G-1].name:'';
  }
  var lastNames=null;
  function render(guests){
    var name=guestName(guests||[]);
    var key=name+'|'+(q.get('char')||'')+'|'+(q.get('id')||'');
    if(key===lastNames && shown!=='logo') return;     // same guest: do nothing (a failed lookup is retried)
    lastNames=key; apply(name);
  }
  function load(){
    fetch(FEED_URL,{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      var cur=currentShow(d.nextShows);
      render(cur?guestsOf(cur.s):(recalled()||[]));
    }).catch(function(e){ log('feed unreachable: '+e.message); render(recalled()||[]); });
  }
  if(q.get('g'+G)||q.get('char')||q.get('id')) render([]);   // hand-typed guests need no show
  load(); setInterval(load,REFRESH_MS);
})();
</script>
